<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Call check</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Call check">
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #0a66d8; --danger: #d70015; --ok: #1a7f37; --field: #f2f2f7; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --accent: #4c9bff; --danger: #ff453a; --ok: #32d74b; --field: #1c1c1e; } }
    body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 32px; background: var(--bg); color: var(--fg);
           font: 17px/1.45 -apple-system, system-ui, sans-serif; }
    main { max-width: 36rem; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0.5rem 0 0.25rem; }
    h2 { font-size: 1rem; margin: 1.25rem 0 0.4rem; color: var(--muted); font-weight: 600; }
    #status { font-size: 1.2rem; font-weight: 600; margin: 0 0 0.25rem; }
    main[data-state="connected"] #status { color: var(--ok); }
    main[data-state="failed"] #status { color: var(--danger); }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    button { font: inherit; padding: 0.65rem 1.1rem; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
    button.secondary { background: var(--field); color: var(--fg); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: 0.4; }
    textarea { box-sizing: border-box; width: 100%; height: 5.5rem; margin: 0 0 0.5rem; padding: 0.6rem; border: 0; border-radius: 10px;
               background: var(--field); color: var(--fg); font: 12px/1.3 ui-monospace, monospace; }
    #stats { color: var(--muted); margin: 0; }
    .hint { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0 0; }
    #error { color: var(--danger); min-height: 1.4em; margin: 0.5rem 0 0; }
    #log { margin: 0 0 0.5rem; padding: 0.6rem; border-radius: 10px; background: var(--field); font: 12px/1.45 ui-monospace, monospace;
           list-style: none; max-height: 16rem; overflow-y: auto; }
  </style>
</head>
<body>
  <main data-state="idle">
    <h1>Call check</h1>
    <p id="status">Ready</p>
    <p id="stats" data-testid="stats" data-bytes-received="0">No audio yet</p>

    <h2>1. Start</h2>
    <div class="row">
      <button id="call" data-testid="call" type="button">Call</button>
      <button id="hangup" data-testid="hangup" class="danger" type="button" disabled>Hang up</button>
      <button id="start-over" data-testid="start-over" class="secondary" type="button">Start over</button>
    </div>
    <p class="hint">Tap Call on <b>one</b> device only. The other device answers:
      it pastes the caller's text in box 2 and taps Use.</p>

    <h2>2. Text from the other device</h2>
    <textarea id="incoming" data-testid="incoming" placeholder="Paste the other device's text here"></textarea>
    <div class="row">
      <button id="paste" class="secondary" type="button">Paste</button>
      <button id="use" data-testid="use" type="button">Use</button>
    </div>

    <h2>3. Text for the other device</h2>
    <textarea id="outgoing" data-testid="outgoing" readonly placeholder="Appears after Call or Use"></textarea>
    <button id="copy" class="secondary" type="button" disabled>Copy</button>

    <p id="error" data-testid="error" role="alert"></p>

    <h2>Log</h2>
    <ul id="log" data-testid="log"></ul>
    <button id="copy-log" data-testid="copy-log" class="secondary" type="button">Copy log</button>
    <audio id="remote" playsinline></audio>
  </main>
  <script src="app.js"></script>
</body>
</html>
